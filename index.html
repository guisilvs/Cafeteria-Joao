<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratones Coffee</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <h1>Ratones Coffee</h1>
            <div class="profile-pic">
                <img src="https://via.placeholder.com/40" alt="Perfil do usuário">
            </div>
        </header>

        <nav class="category-tabs">
            <button class="tab active">Gelados</button>
            <button class="tab">Quentes</button>
            <button class="tab">Sanduíches</button>
        </nav>

        <main class="products-grid">
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <div class="nav-icon-bg"><i class="fas fa-mug-hot"></i></div>
                <span>Cardápio</span>
            </button>
            <button class="nav-item">
                <i class="far fa-heart"></i>
                <span>Favoritos</span>
            </button>
            <button class="nav-item">
                <i class="fas fa-shopping-bag"></i>
                <span>Pedido</span>
            </button>
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
